<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>손질왕 - 업무관리</title>
  <meta name="description" content="손질왕 판매 및 수매 업무 관리 시스템">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=1.3.0-test">
</head>
<body class="main-body">
  <div class="main-bg-circle c1"></div>
  <div class="main-bg-circle c2"></div>

  <div class="main-container">
    <div class="logo-wrapper">
      <img src="images/logo.png" alt="손질왕 로고" class="main-logo" id="main-logo">
      <div class="logo-glow"></div>
    </div>

    <!-- Login/Register Area -->
    <div id="auth-section" class="auth-card" style="display: none;">
      <h2 id="auth-title" style="margin-bottom: 20px; text-align: center; color: #1e3a8a;">로그인</h2>
      
      <form id="auth-form" onsubmit="event.preventDefault(); handleAuthSubmit();">
        <div id="register-fields" style="display: none;">
          <input type="text" id="auth-name" class="auth-input" placeholder="이름 (실명)">
          <input type="text" id="auth-nickname" class="auth-input" placeholder="닉네임 (선택)">
          <input type="email" id="auth-email" class="auth-input" placeholder="복구 이메일 (선택)">
        </div>
        
        <input type="text" id="auth-username" class="auth-input" placeholder="아이디" required>
        <input type="password" id="auth-password" class="auth-input" placeholder="비밀번호" required>
        
        <button type="submit" id="auth-submit-btn" class="btn-save" style="width: 100%; margin-top: 10px;">로그인</button>
      </form>
      
      <div style="text-align: center; margin-top: 15px; font-size: 0.9rem;">
        <span id="auth-toggle-text">계정이 없으신가요?</span>
        <a href="#" id="auth-toggle-btn" onclick="toggleAuthMode()" style="color: #3b82f6; font-weight: bold; text-decoration: none;">회원가입</a>
      </div>
    </div>

    <!-- Main Menu Area -->
    <div id="menu-section" style="display: none; width: 100%; max-width: 900px; margin: 0 auto; position: relative; z-index: 10;">
      <div class="user-welcome-bar">
        <div class="user-info">
          <span class="user-avatar">👤</span>
          <span id="welcome-text" class="user-name"></span>
        </div>
        <div class="user-top-actions">
          <a href="profile.html" class="btn-profile-small">내 정보 변경</a>
          <button onclick="logout()" class="btn-logout">로그아웃</button>
        </div>
      </div>

      <div class="menu-grid">
        <a href="sales.html" class="menu-card" id="btn-sales">
          <div class="menu-icon">🧾</div>
          <div class="menu-title">판매</div>
          <div class="menu-subtitle">매출 · 미수금 관리</div>
          <div class="menu-arrow">→</div>
        </a>
        <a href="purchase.html" class="menu-card" id="btn-purchase">
          <div class="menu-icon">📦</div>
          <div class="menu-title">수매</div>
          <div class="menu-subtitle">매입 관리</div>
          <div class="menu-arrow">→</div>
        </a>
        <a href="statistics.html" class="menu-card" id="btn-statistics">
          <div class="menu-icon">📊</div>
          <div class="menu-title">통계</div>
          <div class="menu-subtitle">매출 · 지출 통합 분석</div>
          <div class="menu-arrow">→</div>
        </a>
        <a href="item-statistics.html" class="menu-card" id="btn-item-statistics">
          <span class="menu-new-badge item-statistics-new">NEW</span>
          <div class="menu-icon">🐟</div>
          <div class="menu-title">품목통계</div>
          <div class="menu-subtitle">품목별 판매 · 수매 분석</div>
          <div class="menu-arrow">→</div>
        </a>
        <a href="statements.html" class="menu-card" id="btn-statements">
          <div class="menu-icon">📄</div>
          <div class="menu-title">거래명세서</div>
          <div class="menu-subtitle">판매 명세서 텍스트 보관함</div>
          <div class="menu-arrow">→</div>
        </a>
        <a href="notices.html" class="menu-card" id="btn-notices">
          <span class="menu-new-badge">NEW</span>
          <div class="menu-icon">📢</div>
          <div class="menu-title">공지사항</div>
          <div class="menu-subtitle">새 기능 · 수정사항 안내</div>
          <div class="menu-arrow">→</div>
        </a>
        <a href="admin.html" class="menu-card" id="btn-admin" style="display:none;">
          <div class="menu-title">회원 관리</div>
          <div class="menu-subtitle">가입자 및 데이터 사용 현황</div>
          <div class="menu-arrow">→</div>
        </a>
      </div>
    </div>

    <div class="footer-tagline">정성으로 손질하고, 신선함으로 채웁니다.</div>
  </div>

  <div id="toast-container"></div>
  <script src="js/api.js?v=1.2.1"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
