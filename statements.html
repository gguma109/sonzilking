<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>거래명세서 - 손질왕</title>
  <meta name="description" content="손질왕 거래명세서 텍스트 보관함">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="page-header">
    <a href="#" class="btn-back" aria-label="이전 화면" onclick="goBackOrHome(event)">←</a>
    <a href="index.html" class="header-brand" aria-label="손질왕 메인 화면으로 이동"><img src="images/header-logo.svg" alt="손질왕" class="header-logo"></a>
    <h1 class="page-title">거래명세서</h1>
    <button onclick="logout()" class="btn-del" style="padding:4px 8px;width:auto;font-size:0.8rem;margin-left:auto;">로그아웃</button>
  </header>
  <main class="page-body">
    <section class="records-card">
      <div class="records-header">
        <div class="records-title">📄 거래명세서 텍스트 보관함</div>
        <div class="records-count" id="statements-count">0건</div>
      </div>
      <div class="statement-list-filter">
        <label for="statements-type">구분</label>
        <select id="statements-type" class="form-control">
          <option value="all">전체</option>
          <option value="sale">판매</option>
          <option value="purchase">수매</option>
        </select>
      </div>
      <input type="text" class="records-search" id="statements-search" placeholder="🔍 거래처명으로 검색...">
      <div id="statements-list"><div class="loading"><div class="spinner"></div></div></div>
    </section>
  </main>
  <div class="modal-overlay statement-image-preview-modal" id="statement-image-preview-modal">
    <div class="statement-image-preview-content">
      <div class="statement-image-preview-header"><strong>거래명세서 사진 미리보기</strong><button type="button" id="close-statement-image-preview">닫기</button></div>
      <div class="statement-image-preview-scroll"><img id="statement-image-preview" alt="거래명세서 사진 미리보기"></div>
      <a href="https://www.hometax.go.kr/" target="_blank" rel="noopener noreferrer" class="btn-pay hometax-link">홈택스 바로가기</a>
      <button type="button" class="btn-save" id="save-previewed-statement">사진으로 저장</button>
    </div>
  </div>
  <div class="toast-container" id="toast-container"></div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/statements.js"></script>
</body>
</html>
