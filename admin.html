<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원 관리 - 손질왕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=1.2.1">
</head>
<body>
  <header class="page-header">
    <a href="#" class="btn-back" aria-label="이전 화면" onclick="goBackOrHome(event)">←</a>
    <a href="index.html" class="header-brand" aria-label="메인 화면"><img src="images/header-logo.svg" alt="손질왕" class="header-logo"></a>
    <h1 class="page-title">회원 관리</h1>
    <button onclick="logout()" class="btn-del" style="padding:4px 8px;width:auto;font-size:0.8rem;margin-left:auto;">로그아웃</button>
  </header>
  <main class="page-body">
    <section class="records-card">
      <div class="records-header">
        <div>
          <div class="records-title">가입 회원</div>
          <div class="admin-access-label" id="admin-access-label"></div>
        </div>
        <div class="records-count" id="admin-user-count">0명</div>
      </div>
      <div id="admin-users-list"><div class="loading"><div class="spinner"></div></div></div>
    </section>
  </main>
  <div class="modal-overlay" id="password-reset-modal" onclick="if (event.target === this) closePasswordResetModal();">
    <form class="modal-content admin-password-modal" id="password-reset-form">
      <div class="modal-header">
        <div class="section-title">비밀번호 재설정</div>
        <button type="button" class="btn-close-modal" onclick="closePasswordResetModal()" aria-label="닫기">✖</button>
      </div>
      <p class="profile-help"><strong id="password-reset-username"></strong> 회원에게 설정할 새 비밀번호를 입력해주세요. 변경하면 기존 로그인은 모두 해제됩니다.</p>
      <div class="form-group">
        <label class="form-label" for="admin-new-password">새 비밀번호</label>
        <input type="password" id="admin-new-password" class="auth-input" minlength="4" autocomplete="new-password" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="admin-confirm-password">새 비밀번호 확인</label>
        <input type="password" id="admin-confirm-password" class="auth-input" minlength="4" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn-save">비밀번호 재설정</button>
    </form>
  </div>
  <div class="toast-container" id="toast-container"></div>
  <script src="js/api.js?v=1.2.1"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
