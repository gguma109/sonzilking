<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수매 관리 - 손질왕</title>
  <meta name="description" content="손질왕 수매 관리 - 키로수, 단가, 합계 계산 및 기록">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="page-header">
    <a href="#" class="btn-back" id="btn-back" aria-label="이전 화면" onclick="goBackOrHome(event)">←</a>
    <a href="index.html" class="header-brand" aria-label="손질왕 메인 화면으로 이동"><img src="images/header-logo.svg" alt="손질왕" class="header-logo"></a>
    <h1 class="page-title">수매</h1>
    <button onclick="logout()" class="btn-del" style="padding: 4px 8px; width:auto; font-size: 0.8rem; margin-left: auto;">로그아웃</button>
  </header>

  <main class="page-body">
    <!-- ===== TABS ===== -->
    <div class="nav-tabs">
      <div class="nav-item active" data-tab="tab-purchase">🐙 수매</div>
      <div class="nav-item" data-tab="tab-notes">📝 메모장</div>
    </div>

    <!-- =========================
         TAB 1: 수매 관리
    ========================= -->
    <div id="tab-purchase" class="tab-pane active">
      <section class="monthly-summary-card" aria-label="월별 총 지출">
        <div class="monthly-summary-filter">
          <label class="form-label" for="purchase-summary-period">조회 단위</label>
          <select id="purchase-summary-period" class="form-control summary-period-select">
            <option value="month">월별</option>
            <option value="day">일별</option>
          </select>
          <label class="form-label summary-date-label" for="purchase-summary-month" id="purchase-summary-date-label">조회 월</label>
          <input type="month" id="purchase-summary-month" class="form-control">
          <input type="date" id="purchase-summary-day" class="form-control" hidden>
        </div>
        <div class="monthly-summary-total purchase-summary-total">
          <span id="purchase-summary-label">이번 달 총 지출</span>
          <strong><span id="purchase-summary-amount">0</span>원</strong>
          <small id="purchase-summary-count">0건</small>
        </div>
      </section>
      <!-- 모달 오버레이 (수매 입력 폼) -->
      <div class="modal-overlay" id="form-modal">
        <div class="form-card modal-content">
          <div class="modal-header">
            <div class="section-title">📝 수매 입력</div>
            <button class="btn-close-modal" id="btn-close-modal">✖</button>
          </div>

          <!-- 업체명 -->
          <div class="form-group">
            <label class="form-label" for="company-name-pur">업체명</label>
            <input type="text" id="company-name-pur" class="form-control" placeholder="업체명을 입력하세요" autocomplete="off" list="company-datalist-pur">
            <datalist id="company-datalist-pur"></datalist>
            <div class="company-chips" id="company-chips-pur"></div>
          </div>

          <!-- 키로수 단가 계산기 -->
          <div class="form-group">
            <label class="form-label" for="calc-kilos-pur">키로수 단가 계산기 (숫자와 기호만 자동 계산)</label>
            <textarea id="calc-kilos-pur" class="calc-textarea" placeholder="예) 광어 10 * 15000 + 우럭 5 * 10000"></textarea>
            <div class="calc-preview" id="preview-kilos-pur">0원</div>
          </div>

          <!-- 총합계 -->
          <div class="total-card" aria-label="총합계">
            <div class="total-label">총 합계 금액</div>
            <div class="total-right">
              <span class="total-amount" id="grand-total-pur" aria-live="polite">0</span>
              <span class="total-unit">원</span>
            </div>
          </div>

          <!-- 날짜 & 메모 -->
          <div class="form-group">
            <label class="form-label" for="purchase-date">날짜</label>
            <input type="date" id="purchase-date" class="form-control">
          </div>
          <div class="form-group">
            <label class="form-label" for="purchase-memo">메모</label>
            <input type="text" id="purchase-memo" class="form-control" placeholder="메모 (선택사항)">
          </div>

          <button type="button" class="btn-save" id="btn-save-purchase">💾 저장하기</button>
        </div> <!-- /.modal-content -->
      </div> <!-- /.modal-overlay -->

      <!-- 수매 기록 -->
      <div class="records-card">
        <div class="records-header">
          <div class="records-title">📋 수매 기록</div>
          <div class="records-count" id="records-count-pur">0건</div>
        </div>
        <input type="text" class="records-search" id="records-search-pur" placeholder="🔍 업체명으로 검색...">
        <div id="records-list-pur">
          <div class="loading"><div class="spinner"></div></div>
        </div>
      </div>

      <!-- 플로팅 작성 버튼 -->
      <button class="fab-btn" id="btn-open-modal" aria-label="수매 기록 추가">➕</button>
    </div> <!-- /#tab-purchase -->

    <!-- =========================
         TAB 2: 메모장
    ========================= -->
    <div id="tab-notes" class="tab-pane">
      <div class="form-card" style="margin-bottom: 20px;">
        <div class="form-group">
          <textarea id="note-input" class="calc-textarea" placeholder="여기에 새 메모를 작성하세요..." style="min-height: 100px;"></textarea>
        </div>
        <button type="button" class="btn-save" id="btn-save-note">💾 메모 저장</button>
      </div>
      <div id="notes-list"></div>
    </div> <!-- /#tab-notes -->

  </main>

  <div class="toast-container" id="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/tabs.js"></script>
  <script src="js/math_parser.js?v=1785924636969"></script>
  <script src="js/notes.js"></script>
  <script src="js/purchase.js"></script>
</body>
</html>
