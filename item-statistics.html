<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>품목통계 - 손질왕</title>
  <meta name="description" content="첫 번째 판매·수매 품목의 기간별 통계">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=1.3.0-test">
</head>
<body>
  <header class="page-header">
    <a href="#" class="btn-back" aria-label="이전 화면" onclick="goBackOrHome(event)">←</a>
    <a href="index.html" class="header-brand" aria-label="손질왕 메인 화면으로 이동"><img src="images/header-logo.svg" alt="손질왕" class="header-logo"></a>
    <h1 class="page-title">품목통계</h1>
    <button onclick="logout()" class="btn-del item-statistics-logout">로그아웃</button>
  </header>

  <main class="page-body item-statistics-page">
    <section class="item-statistics-filter-card" aria-labelledby="item-statistics-filter-title">
      <div class="item-statistics-filter-heading">
        <div>
          <span>ITEM ANALYTICS</span>
          <h2 id="item-statistics-filter-title">품목과 기간을 선택하세요</h2>
        </div>
        <span class="first-item-badge">첫 품목 기준</span>
      </div>

      <form id="item-statistics-form">
        <div class="form-group">
          <label class="form-label" for="item-statistics-name">품목 검색</label>
          <input type="search" id="item-statistics-name" class="form-control" list="item-statistics-options" placeholder="예) 광어" autocomplete="off" required>
          <datalist id="item-statistics-options"></datalist>
        </div>
        <div class="item-statistics-date-grid">
          <div class="form-group">
            <label class="form-label" for="item-statistics-start">시작일</label>
            <input type="date" id="item-statistics-start" class="form-control" required>
          </div>
          <span class="item-statistics-date-separator">~</span>
          <div class="form-group">
            <label class="form-label" for="item-statistics-end">종료일</label>
            <input type="date" id="item-statistics-end" class="form-control" required>
          </div>
        </div>
        <button type="submit" class="btn-save item-statistics-search-button">통계 조회</button>
      </form>
      <p class="item-statistics-help">입력한 여러 품목 중 가장 앞에 적은 품목의 계산금액만 집계합니다. 판매 부대비용과 수수료는 제외됩니다.</p>
    </section>

    <section id="item-statistics-result" hidden>
      <div class="item-statistics-result-heading">
        <div>
          <span id="item-statistics-period"></span>
          <h2><strong id="item-statistics-selected-name"></strong> 통계</h2>
        </div>
        <span id="item-statistics-total-count">0건</span>
      </div>

      <div class="item-statistics-summary-grid">
        <article class="item-statistics-summary-card sale">
          <span>판매금액</span>
          <strong><span id="item-statistics-sales-amount">0</span>원</strong>
          <small id="item-statistics-sales-meta">0건</small>
        </article>
        <article class="item-statistics-summary-card purchase">
          <span>수매금액</span>
          <strong><span id="item-statistics-purchases-amount">0</span>원</strong>
          <small id="item-statistics-purchases-meta">0건</small>
        </article>
        <article class="item-statistics-summary-card net">
          <span>판매 - 수매</span>
          <strong><span id="item-statistics-net-amount">0</span>원</strong>
          <small>품목 금액 차이</small>
        </article>
      </div>

      <div class="item-statistics-metrics">
        <article><span>판매 수량</span><strong id="item-statistics-sales-quantity">-</strong></article>
        <article><span>수매 수량</span><strong id="item-statistics-purchases-quantity">-</strong></article>
        <article><span>평균 판매단가</span><strong id="item-statistics-sales-average">0원</strong></article>
        <article><span>평균 수매단가</span><strong id="item-statistics-purchases-average">0원</strong></article>
      </div>

      <section class="records-card item-statistics-records">
        <div class="records-header">
          <div class="records-title">📋 해당 품목 거래내역</div>
          <div class="records-count" id="item-statistics-record-count">0건</div>
        </div>
        <div id="item-statistics-record-list"></div>
      </section>
    </section>

    <section id="item-statistics-intro" class="item-statistics-intro">
      <span>🔎</span>
      <strong>조회할 품목을 검색해주세요.</strong>
      <p>선택한 기간 동안 첫 번째 품목으로 입력된 판매와 수매를 비교해드립니다.</p>
    </section>
  </main>

  <div class="toast-container" id="toast-container"></div>
  <script src="js/api.js?v=1.2.1"></script>
  <script src="js/auth.js"></script>
  <script src="js/item_parser.js?v=1.3.0-test"></script>
  <script src="js/item_statistics.js?v=1.3.0-test"></script>
</body>
</html>
