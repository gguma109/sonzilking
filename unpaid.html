<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미수금 현황 - 손질왕</title>
  <meta name="description" content="손질왕 업체별 미수금 현황">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="page-header">
    <a href="index.html" class="btn-back" id="btn-back" aria-label="뒤로가기">←</a>
    <img src="images/logo.png" alt="손질왕" class="header-logo">
    <h1 class="page-title">미수금</h1>
  </header>

  <main class="page-body">

    <!-- ===== 총 미수금 합계 ===== -->
    <div class="total-card" aria-label="총 미수금 합계" style="background: linear-gradient(135deg, #c0392b, #e74c3c); margin-bottom: 24px;">
      <div class="total-label" style="color: rgba(255,255,255,0.9);">전체 미수금 총액</div>
      <div class="total-right">
        <span class="total-amount" id="total-unpaid-amount" aria-live="polite">0</span>
        <span class="total-unit">원</span>
      </div>
    </div>

    <!-- ===== 미수금 기록 ===== -->
    <div class="records-card">
      <div class="records-header">
        <div class="records-title">🧾 업체별 미수금 현황</div>
        <div class="records-count" id="records-count">0곳</div>
      </div>
      <input type="text" class="records-search" id="records-search" placeholder="🔍 업체명으로 검색...">
      <div id="records-list">
        <div class="loading"><div class="spinner"></div></div>
      </div>
    </div>

  </main>

  <div class="toast-container" id="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/unpaid.js"></script>
</body>
</html>
